<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Entry Form</title>
<style> body {
margin: 20px 25px;
font-family: "Times New Roman", serif; font-size: 15px;
}
fieldset {
padding: 18px 135px 12px; border: 2px solid #222;
}
legend { padding: 0 3px;
font-size: 18px; font-weight: bold;
 
}
table {
margin: 0 auto;
border-spacing: 0 8px;
}
th {
padding-right: 35px; text-align: left;
white-space: nowrap;
}
td {
white-space: nowrap;
}
input[type="text"], input[type="email"], input[type="password"], input[type="tel"], input[type="date"] {
width: 132px;
box-sizing: border-box;
}
textarea { width: 162px; height: 42px; resize: both;
vertical-align: top;
}
.actions {
padding-top: 6px; text-align: center;
}
</style>
</head>
 
<body>
<form action="#" method="post" enctype="multipart/form-data">
<fieldset>
<legend>Student Entry Form</legend>
<table>
<tr>
<th><label for="student-id">Student ID</label></th>
<td><input type="text" id="student-id" name="student_id" placeholder="Enter Student ID" required></td>
</tr>
<tr>
<th><label for="student-name">Student Name</label></th>
<td><input type="text" id="student-name" name="student_name" placeholder="Enter Your Name" required></td>
</tr>
<tr>
<th><label for="father-name">Father's Name</label></th>
<td><input type="text" id="father-name" name="father_name" placeholder="Enter Father's Name" required></td>
</tr>
<tr>
<th><label for="mother-name">Mother's Name</label></th>
<td><input type="text" id="mother-name" name="mother_name" placeholder="Enter Mother's Name" required></td>
</tr>
<tr>
<th><label for="date-of-birth">Date of Birth</label></th>
<td><input type="date" id="date-of-birth" name="date_of_birth" required></td>
</tr>
<tr>
<th>Gender</th>
<td>
<input type="radio" id="male" name="gender" value="male" required>
<label for="male">Male</label>
 
<input type="radio" id="female" name="gender" value="female">
<label for="female">Female</label>
<input type="radio" id="other" name="gender" value="other">
<label for="other">Other</label>
</td>
</tr>
<tr>
<th><label for="mobile">Mobile No.</label></th>
<td><input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" title="Enter a 10-digit mobile number" required></td>
</tr>
<tr>
<th><label for="email">Email ID</label></th>
<td><input type="email" id="email" name="email" required></td>
</tr>
<tr>
<th><label for="password">Password</label></th>
<td><input type="password" id="password" name="password" minlength="8" required></td>
</tr>
<tr>
<th><label for="address">Address</label></th>
<td><textarea id="address" name="address" required></textarea></td>
</tr>
<tr>
<th><label for="department">Department</label></th>
<td>
<select id="department" name="department" required>
<option value="">Select</option>
<option value="cse">CSE</option>
<option value="ece">ECE</option>
<option value="me">ME</option>
<option value="ce">CE</option>
</select>
 
</td>
</tr>
<tr>
<th><label for="course">Course</label></th>
<td>
<select id="course" name="course" required>
<option value="">Select</option>
<option value="btech">B.Tech</option>
<option value="mtech">M.Tech</option>
<option value="bca">BCA</option>
</select>
</td>
</tr>
<tr>
<th><label for="semester">Semester</label></th>
<td>
<select id="semester" name="semester" required>
<option value="">Select</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
</select>
</td>
</tr>
<tr>
<th>Hobbies</th>
<td>
<input type="checkbox" id="reading" name="hobbies" value="reading">
 
<label for="reading">Reading</label>
<input type="checkbox" id="sports" name="hobbies" value="sports">
<label for="sports">Sports</label>
<input type="checkbox" id="music" name="hobbies" value="music">
<label for="music">Music</label>
</td>
</tr>
<tr>
<th><label for="photo">Upload Photo</label></th>
<td><input type="file" id="photo" name="photo" accept="image/*"></td>
</tr>
<tr>
<td class="actions" colspan="2">
<button type="submit">Submit</button>
<button type="reset">Reset</button>
</td>
</tr>
</table>
</fieldset>
</form>
</body>
</html>
